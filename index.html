    <title>Tip Calculator</title>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-[#050114] flex flex-col items-center sm:gap-12">
    <h1 class="text-[4rem] text-[#5656b1] font-bold pt-20">Split & Share</h1>
    <p class="text-[1.75rem] text-[#e3e4f8] text-center pt-5">
      The smart way to calculate and split bills with friends. Perfect to dining
      out, group activities, or share expenses get instant calculations with
      fair splits and details breakdowns.
    </p>
    <div class="w-3/4 sm:flex sm:gap-11 sm:justify-center pt-10 pb-8">
      <!-- premiere division du bord -->

      <div
        class="border border-gray-50 sm:w-2/5 mt-10 p-5 rounded-2xl flex flex-col gap-12 shadow-2xs bg-[#020008] pb-9"
      >
        <div class="flex flex-col gap-3">
          <label
            for="billAmount"
            class="text-[#e3e4f8] text-2xl flex items-center gap-3"
          >
            <ion-icon name="calendar-clear-outline"></ion-icon>BILL
            AMOUNT</label
          >
          <input
            type="text"
            id="billAmount"
            placeholder="Enter the total bill amount"
            class="border text-[#e3e4f8] rounded-xl p-3 bg-[#050114] text-2xl"
          />
        </div>
        <div class="flex flex-col gap-3">
          <label
            for="servicerating"
            class="text-[#e3e4f8] text-2xl flex items-center gap-3"
          >
            <ion-icon name="star-outline"></ion-icon>SERVICE RATING</label
          >
          <select
            id="servicerating"
            class="border rounded-xl text-[#e3e4f8] p-3 bg-[#050114] text-2xl"
          >
            <option value="0.2">Exceptional -20%</option>
            <option value="0.15">Good -15%</option>
            <option value="0.1">Fair -10%</option>
            <option value="0.05">Poor -5%</option>
          </select>
        </div>

        <div class="flex flex-col gap-3">
          <label
            for="numberOfPeople"
            class="text-[#e3e4f8] text-2xl flex items-center gap-3"
            ><ion-icon name="people-outline"></ion-icon>NUMBER OF PEOPLE</label
          >
          <input
            type="number"
            id="numberOfPeople"
            value="1"
            min="1"
            class="border rounded-xl text-[#e3e4f8] p-3 bg-[#050114] text-2xl"
          />
        </div>
        <button
          class="bg-[#5656b1] px-8 py-8 rounded-xl text-[#e3e4f8] text-2xl flex items-center gap-3 justify-center"
          id="calculateBtn"
        >
          <ion-icon name="calculator-outline"></ion-icon>
          Calculate Split
        </button>
      </div>

      <!-- deuxieme division du bord -->

      <div
        class="sm:w-3/5 mt-10 p-5 rounded-2xl flex flex-col gap-5 bg-[#020008] border border-gray-50 items-center pb-9"
      >
        <h3 class="text-[#e3e4f8] text-4xl py-5 font-bold">Breakdown</h3>
        <div class="flex gap-11">
          <div
            class="border border-gray-50 sm:py-7 flex flex-col items-center bg-[#050114] rounded-2xl gap-3 w-50 sm:w-100"
          >
            <p class="text-xl text-[#e3e4f8]">Tip amount</p>
            <div class="text-5xl font-bold text-[#6565ad] py-6" id="tipAmount">
              $0.00
            </div>
          </div>

          <div
            class="border border-gray-50 sm:py-7 flex flex-col items-center bg-[#050114] rounded-2xl gap-3 w-50 sm:w-100"
          >
            <p class="text-xl text-[#e3e4f8]">Total Bill</p>
            <div
              class="text-5xl font-bold text-[#6565ad] py-6"
              id="totalAmount"
            >
              $0.00
            </div>
          </div>
        </div>

        <div class="flex gap-11">
          <div
            class="border border-gray-50 sm:py-7 flex flex-col items-center bg-[#050114] rounded-2xl gap-3 w-50 sm:w-100"
          >
            <p class="text-xl text-[#e3e4f8]">per Person</p>
            <div
              class="text-5xl font-bold text-[#6565ad] py-6"
              id="tipPerPerson"
            >
              $0.00
            </div>
          </div>
          <div
            class="border border-gray-50 sm:py-7 flex flex-col items-center bg-[#050114] rounded-2xl gap-3 w-50 sm:w-100"
          >
            <p class="text-xl text-[#e3e4f8]">Total per Person</p>
            <div
              class="text-5xl font-bold text-[#6565ad] py-6"
              id="totalPerPerson"
            >
              $0.00
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
